; ============================================================
;  Car_Project - PlatformIO
;  Nguồn nằm trong hardware/. Mỗi env chỉ build đúng file của nó,
;  tránh việc biên dịch lẫn code Arduino/ESP32/C3 với nhau.
; ============================================================

[platformio]
src_dir = hardware
default_envs = esp32-c3-supermini

[env]
monitor_speed = 115200

; ------------------------------------------------------------
;  ESP32-C3 Super Mini - hub Memorable Device (RDM6300 + OLED + nút bấm)
;  Code: hardware/esp32_c3/esp32_c3.cpp
; ------------------------------------------------------------
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    -<*>
    +<esp32_c3/>
lib_deps =
    olikraus/U8g2@^2.35.0
    https://github.com/arduino12/rdm6300.git

; ------------------------------------------------------------
;  ESP32-WROOM 38 chân - xe + tay máy (firmware chính)
;  Code: hardware/esp32/main.cpp + arm_control.cpp + car_control.cpp
; ------------------------------------------------------------
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
build_src_filter =
    -<*>
    +<esp32/main.cpp>
    +<esp32/arm_control.cpp>
    +<esp32/car_control.cpp>
lib_deps =
    madhephaestus/ESP32Servo@^3.0.0

; ---- Test riêng từng bộ phận (mỗi file test có setup()/loop() riêng) ----
[env:esp32-arm-test]
extends = env:esp32
build_src_filter =
    -<*>
    +<esp32/arm_test.cpp>
    +<esp32/arm_control.cpp>

[env:esp32-car-test]
extends = env:esp32
build_src_filter =
    -<*>
    +<esp32/car_test.cpp>
    +<esp32/car_control.cpp>

; ------------------------------------------------------------
;  Arduino AVR (bản cũ dùng VarSpeedServo + SoftwareSerial)
;  Code: hardware/arduino/main.cpp + arm_control.cpp
; ------------------------------------------------------------
[env:arduino]
platform = atmelavr
board = uno
framework = arduino
build_src_filter =
    -<*>
    +<arduino/main.cpp>
    +<arduino/arm_control.cpp>
lib_deps =
    netlabtoolkit/VarSpeedServo